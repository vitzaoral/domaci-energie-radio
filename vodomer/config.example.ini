# vodomer-radio – příklad konfigurace / example configuration
# Zkopírujte do /etc/vodomer-radio.conf a upravte. Copy to /etc/vodomer-radio.conf.

[meters]
# ID rádiového modulu = název. ID je natištěné na modulu E-RM 30 (ne na vodoměru).
# Radio module ID = name. The ID is printed on the E-RM 30 module, not on the meter.
# Prázdné = vypíše všechny zachycené moduly (i sousedů), jen pro hledání vlastního ID.
123456789 = studena
# 987654321 = tepla

[radio]
rtl_433 = rtl_433
frequency = 868.9M
sample_rate = 1000k
# 0 = automatický zisk (doporučeno), jinak dB / 0 = auto gain (recommended)
gain = 0
# device = 0
# další volby pro rtl_433 / extra rtl_433 options
extra_args =

[output]
# text | json | none
stdout = text
# changes = jen změna stavu + potvrzení po heartbeat_minutes; all = každý přijatý rámec
emit = changes
heartbeat_minutes = 60

[http]
# Prázdné = vypnuto. Každý odečet se pošle jako JSON (POST). Empty = disabled.
url =
# url = http://homeassistant.local:8123/api/webhook/vodomer
# volitelně hlavička Authorization: Bearer <token> / optional bearer token
token =
timeout = 10

[mqtt]
# Prázdné = vypnuto / empty = disabled
host =
# host = 127.0.0.1
port = 1883
username =
password =
# {id} = ID modulu, {name} = název z [meters]
topic = vodomer/{id}
retain = true
client_id = vodomer-radio
