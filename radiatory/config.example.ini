# hlavice-cidlo – příklad konfigurace, zkopírujte do /etc/hlavice-cidlo.conf
[mqtt]
host = 127.0.0.1
port = 1883
username = hlavice
password = nahradte-heslem
base_topic = zigbee2mqtt

[hlavice]
# friendly_name hlavice v zigbee2mqtt = friendly_name pokojového čidla (cokoli s polem temperature)
Obyvak hlavice = Obyvak cidlo
# Loznice hlavice = Loznice cidlo

[nastaveni]
# Čidlo je čerstvé, když měřilo za posledních N minut. Čidla Aqara/Xiaomi posílají
# změnu nebo nejpozději po 60 min, proto 75 (při 30 by hlavice pořád přepínala).
room_fresh_minutes = 75
# Teplotu poslat znovu i beze změny po N minutách
refresh_minutes = 20
# Hystereze TRVZB (-0,2 až -1, z výroby -1). Prázdné = neměnit.
accuracy = -0.2
# Obejít chybu firmwaru 1.3.0, který hysterezi ignoruje (viz README)
wake_pulse = true
