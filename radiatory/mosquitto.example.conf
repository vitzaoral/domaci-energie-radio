# /etc/mosquitto/conf.d/local.conf – broker jen pro tento počítač, bez anonymního přístupu.
# Účty: sudo mosquitto_passwd -c /etc/mosquitto/passwd z2m ; sudo mosquitto_passwd /etc/mosquitto/passwd hlavice
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
listener 1883 127.0.0.1
